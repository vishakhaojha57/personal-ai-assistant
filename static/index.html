<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Assistant — Your Smart Study Buddy</title>
    <meta name="description" content="A smart personal AI assistant with academic RAG, personal notes, and intelligent chat powered by Gemini.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">

        <!-- ─── Sidebar ──────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                            <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="currentColor" opacity="0.9"/>
                            <path d="M19 15L19.8 18.2L23 19L19.8 19.8L19 23L18.2 19.8L15 19L18.2 18.2L19 15Z" fill="currentColor" opacity="0.6"/>
                            <path d="M5 2L5.6 4.4L8 5L5.6 5.6L5 8L4.4 5.6L2 5L4.4 4.4L5 2Z" fill="currentColor" opacity="0.5"/>
                        </svg>
                    </div>
                    <span class="logo-label">AI Assistant</span>
                </div>
                <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Quick Actions -->
            <div class="sidebar-nav">
                <button class="nav-btn" id="btn-new-chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
                    New Chat
                </button>
                <button class="nav-btn" id="btn-toggle-notes">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    My Notes
                </button>
            </div>

            <!-- PDF Upload Section -->
            <div class="sidebar-section">
                <p class="section-label">Academic Documents</p>
                <div class="upload-zone" id="upload-zone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>Upload PDF</span>
                    <input type="file" id="pdf-input" accept=".pdf" hidden>
                </div>
                <div class="upload-progress" id="upload-progress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span class="progress-text" id="progress-text">Uploading...</span>
                </div>
                <div class="pdf-list" id="pdf-list"></div>
            </div>

            <div class="sidebar-spacer"></div>

            <!-- Theme Toggle & Status -->
            <div class="sidebar-footer">
                <div class="status-row" id="status-card">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">
                    <span class="theme-icon dark-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    </span>
                    <span class="theme-icon light-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </span>
                    <span class="theme-label"></span>
                </button>
            </div>
        </aside>

        <!-- ─── Main Chat Area ────────────────────────────────── -->
        <main class="chat-main">
            <!-- Top Bar -->
            <header class="chat-header">
                <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="header-title">
                    <span>Chat</span>
                    <span class="mode-badge" id="current-mode">GENERAL</span>
                </div>
                <button class="icon-btn" id="btn-clear-chat" title="Clear chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </button>
            </header>

            <!-- Chat Messages Container -->
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-container" id="welcome-container">
                    <div class="welcome-logo">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
                            <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="currentColor" opacity="0.9"/>
                            <path d="M19 15L19.8 18.2L23 19L19.8 19.8L19 23L18.2 19.8L15 19L18.2 18.2L19 15Z" fill="currentColor" opacity="0.6"/>
                            <path d="M5 2L5.6 4.4L8 5L5.6 5.6L5 8L4.4 5.6L2 5L4.4 4.4L5 2Z" fill="currentColor" opacity="0.5"/>
                        </svg>
                    </div>
                    <h1 class="welcome-title">How can I help you today?</h1>
                    <div class="welcome-chips">
                        <button class="chip" data-message="What can you help me with?">What can you do?</button>
                        <button class="chip" data-message="Help me study for my exam">Study Help</button>
                        <button class="chip" data-message="remember: Review chapter 5 for tomorrow's exam">Save a Note</button>
                        <button class="chip" data-message="What are my saved notes?">View My Notes</button>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea
                        id="message-input"
                        placeholder="Message AI Assistant..."
                        rows="1"
                        autofocus
                    ></textarea>
                    <button class="send-btn" id="send-btn" aria-label="Send message" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
                <p class="input-hint">Press <kbd>Enter</kbd> to send &middot; <kbd>Shift+Enter</kbd> for new line</p>
            </div>
        </main>

        <!-- ─── Notes Panel ───────────────── -->
        <div class="notes-panel" id="notes-panel">
            <div class="notes-header">
                <h3>My Notes</h3>
                <button class="icon-btn" id="notes-close" aria-label="Close notes panel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="notes-add">
                <textarea id="note-input" placeholder="Write a quick note..." rows="2"></textarea>
                <button class="note-save-btn" id="note-save-btn">Save Note</button>
            </div>
            <div class="notes-list" id="notes-list">
                <div class="notes-empty"><p>No notes yet.</p></div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
